name: Build and Release

on:
  push:
    branches:
      - 'arena/38c52815-app'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package is no longer available from Google.
          # Install the packages required by compileSdk 36 and AGP 8.9.2 explicitly.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Validate Gradle Wrapper
        run: |
          ./scripts/verify-gradle-wrapper.sh
        continue-on-error: true
        timeout-minutes: 5

      - name: Retry Gradle Wrapper Validation (if needed)
        run: |
          echo "Checking if Gradle wrapper validation is needed..."
          # If the previous step failed, try a manual validation approach
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar.sha256" ]; then
            echo "Gradle wrapper checksum missing, generating new one..."
            ./scripts/fix-gradle-wrapper.sh
          else
            echo "Gradle wrapper checksum already exists, continuing..."
          fi
        continue-on-error: true

      - name: Check Gradle Wrapper Validation Result
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar.sha256" ]; then
            echo "Gradle wrapper checksum missing, generating new one..."
            cd gradle/wrapper
            sha256sum gradle-wrapper.jar > gradle-wrapper.jar.sha256
          fi

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Prepare and validate release signing
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEY_STORE KEY_STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error title=Missing Android signing secrets::Configure ${missing[*]} under Settings > Secrets and variables > Actions. KEY_STORE must contain the Base64-encoded original release keystore."
            exit 1
          fi

          umask 077
          # Accept wrapped Base64, but never ignore a decoding error or create
          # an empty keystore when the secret is missing.
          if ! printf '%s' "$KEY_STORE" | tr -d '[:space:]' | base64 --decode > app/keystore.jks; then
            echo "::error title=Invalid keystore encoding::KEY_STORE must be the Base64 contents of the binary .jks/.p12 file, not its path or password."
            exit 1
          fi
          if [[ ! -s app/keystore.jks ]]; then
            echo "::error title=Empty release keystore::KEY_STORE decoded to an empty file. Upload the original release keystore as Base64."
            exit 1
          fi
          # Validate the store and alias without printing secrets or certificates.
          if ! keytool -list -keystore app/keystore.jks \
              -storepass:env KEY_STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error title=Invalid release keystore::Cannot open KEY_STORE with KEY_STORE_PASSWORD and KEY_ALIAS. Check the original file, store password, and alias."
            exit 1
          fi

          printf '%s\n' "storePassword=${KEY_STORE_PASSWORD//\\/\\\\}" > key.properties
          printf '%s\n' "keyPassword=${KEY_PASSWORD//\\/\\\\}" >> key.properties
          printf '%s\n' "keyAlias=${KEY_ALIAS//\\/\\\\}" >> key.properties
          printf '%s\n' 'storeFile=keystore.jks' >> key.properties
          echo 'Release keystore and alias validated successfully.'

      # NOTE: this step MUST run before "Build APK" so the tag can be
      # injected into the APK as versionName / versionCode.
      - name: Get tag name
        id: get_tag
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # Branch pushes are test builds, not releases. Never derive an
            # Android version from digits that happen to occur in a branch name.
            TAG_NAME="v0.0.${GITHUB_RUN_NUMBER}"
          fi
          APP_VERSION_NAME="${TAG_NAME#v}"
          APP_VERSION_NAME="${APP_VERSION_NAME#V}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> $GITHUB_ENV
          echo "Tag name: $TAG_NAME"
          echo "App version name: $APP_VERSION_NAME"

      - name: Build APK
        id: build_apk
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain -x lint \
            -PappVersionName="${APP_VERSION_NAME}" 2>&1 | tee build-apk.log

      - name: Report APK build errors
        if: ${{ failure() && steps.build_apk.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("build-apk.log").read_text(errors="replace")
          lines = log.splitlines()

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          errors = [line for line in lines if re.match(r"^e: |^FAILURE: |^Execution failed|^Caused by:|^\s*error:", line)]
          for line in errors[:10]:
              print(f"::error title=APK build error::{escape(line)}")
          details = "\n".join(lines[-120:])
          print(f"::warning title=APK build failure details::{escape(details)}")
          PY

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-universal-release.apk \
             release/DarkNama-${TAG_NAME}-universal.apk

      - name: Create Release
        id: create_release
        if: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            release/DarkNama-${{ env.TAG_NAME }}-universal.apk
          body: |
            ## DarkNama Release ${{ env.TAG_NAME }}

            **App version:** ${{ env.APP_VERSION_NAME }}

            ### What's New
            - Modernized UI with enhanced user experience
            - Improved performance and stability
            - New features and bug fixes

            ### Download Options
            - [Universal APK (all architectures)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/DarkNama-${{ env.TAG_NAME }}-universal.apk) - Compatible with all devices

            ### Installation
            1. Download the appropriate APK file for your device
            2. Enable "Install from unknown sources" in your device settings
            3. Open and install the APK
            4. Launch DarkNama and enjoy your movies!
